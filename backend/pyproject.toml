[project]
name = "eigenflow-api"
version = "0.1.0"
description = "Scientific-computing API for Eigenflow's spectral graph visualizations"
readme = "README.md"
authors = [
    { name = "sebastian-padstats", email = "sebastian@padstats.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
eigenflow-api = "eigenflow_api.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=eigenflow_api --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
